<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        var stored = localStorage.getItem('dapet-theme');
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3483E4" />
    <meta
      name="description"
      content="Dapet — სოციალური მედია პლატფორმა, რომელიც აერთიანებს ცხოველზე დაფუძნებულ პროფილს, თემატურ ჯგუფებს, განცხადებებს და სერვის ცენტრებს ერთ აპში."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Dapet — სოციალური მედია პლატფორმა შინაური ცხოველებისთვის</title>
  </head>
